name: "web-page-inspector"
description: "Captures current viewport layout, accessibility tree, and interactive element summaries."
input_schema:
  type: object
  properties:
    include_text_content:
      type: boolean
      description: "Whether to extract readable text snippets across the page."
      default: true
    max_elements:
      type: integer
      description: "Maximum number of interactive element descriptors to return."
      default: 50
  required: []
